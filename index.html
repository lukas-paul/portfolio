<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <link rel="manifest" href="/manifest.json" />
        <!-- Sanity is queried as soon as the app boots — warm up the
             connection in parallel with JS parsing instead of only
             starting the handshake once fetch() actually runs. -->
        <link rel="preconnect" href="https://lyh3u1ah.apicdn.sanity.io" crossorigin />
        <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
        <!-- Self-hosted font (see index.css) — preload the file used by
             Latin text so headings using it don't wait on discovering the
             @font-face rule via the CSS cascade first. -->
        <link
            rel="preload"
            href="/fonts/major-mono-display-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <!-- Baseline metadata for first paint / non-JS crawlers.
             Seo.jsx overrides these from Sanity siteSettings at runtime. -->
        <title>Lukas Frenzer</title>
        <meta
            name="description"
            content="Lukas Frenzer's Web Development Website"
        />
        <meta name="author" content="Lukas Frenzer" />
        <meta property="og:title" content="Lukas Frenzer" />
        <meta
            property="og:description"
            content="Lukas Frenzer's Web Development Website"
        />
        <meta
            property="og:image"
            content="https://cdn.sanity.io/images/lyh3u1ah/production/d355c5edc67956d4c5da4f6fee548ab4b098dcbe-605x556.png"
        />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
