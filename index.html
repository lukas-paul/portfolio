<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Sanity is queried as soon as the app boots — warm up the
             connection in parallel with JS parsing instead of only
             starting the handshake once fetch() actually runs. -->
        <link rel="preconnect" href="https://lyh3u1ah.apicdn.sanity.io" crossorigin />
        <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
        <!-- Load non-blocking: the font stylesheet would otherwise delay
             first paint for a round trip. media="print" makes the browser
             fetch it without it qualifying as render-blocking, then the
             onload flips it to screen once it's in. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&display=swap"
            />
        </noscript>
        <!-- Baseline metadata for first paint / non-JS crawlers.
             Seo.jsx overrides these from Sanity siteSettings at runtime. -->
        <title>Lukas Frenzer</title>
        <meta
            name="description"
            content="Lukas Frenzer's Web Development Website"
        />
        <meta name="author" content="Lukas Frenzer" />
        <meta property="og:title" content="Lukas Frenzer" />
        <meta
            property="og:description"
            content="Lukas Frenzer's Web Development Website"
        />
        <meta
            property="og:image"
            content="https://cdn.sanity.io/images/lyh3u1ah/production/d355c5edc67956d4c5da4f6fee548ab4b098dcbe-605x556.png"
        />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
